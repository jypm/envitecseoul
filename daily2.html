<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>수거 일지</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; background:#000; color:#f0f0f5; font-family:-apple-system,'Noto Sans KR',sans-serif; font-size:14px; color-scheme:dark; }

/* ── 화면 전환 ── */
.screen { display:none; flex-direction:column; height:100vh; overflow:hidden; }
.screen.active { display:flex; }

/* ── 공통 헤더 ── */
.hdr { background:#111; border-bottom:1px solid #222; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.hdr-title { font-size:15px; font-weight:700; }
.hdr-sub { font-size:11px; color:#666; margin-top:2px; }
.btn { border:none; border-radius:8px; padding:7px 14px; font-size:13px; font-weight:600; cursor:pointer; }
.btn-primary { background:#3D82F6; color:#fff; }
.btn-secondary { background:#1e1e2a; color:#aaa; border:1px solid #333; }
.btn-danger { background:#c0392b; color:#fff; }
.btn-sm { padding:5px 10px; font-size:12px; border-radius:6px; }

/* ── 로그인 ── */
#loginScreen { justify-content:center; align-items:center; background:#000; }
.login-box { width:100%; max-width:320px; background:#111; border:1px solid #222; border-radius:16px; padding:32px 24px; margin:20px; }
.login-logo { font-size:28px; text-align:center; margin-bottom:6px; }
.login-title { font-size:18px; font-weight:700; text-align:center; margin-bottom:4px; }
.login-sub { font-size:12px; color:#555; text-align:center; margin-bottom:24px; }
.inp { width:100%; background:#1a1a1a; border:1px solid #2a2a2a; border-radius:10px; padding:12px 14px; color:#f0f0f5; font-size:15px; outline:none; margin-bottom:10px; }
.inp:focus { border-color:#3D82F6; }
.login-err { font-size:12px; color:#e74c3c; text-align:center; margin-top:6px; display:none; }
.save-id { display:flex; align-items:center; gap:6px; font-size:12px; color:#666; margin-bottom:14px; cursor:pointer; }
.save-id input { accent-color:#3D82F6; }

/* ── 코스 목록 (메인) ── */
#courseListScreen .scroll { flex:1; overflow-y:auto; padding:12px; }
.section-label { font-size:11px; color:#555; text-transform:uppercase; letter-spacing:1px; padding:8px 4px 6px; }
.course-item { background:#111; border:1px solid #222; border-radius:12px; padding:14px 16px; margin-bottom:8px; display:flex; align-items:center; gap:12px; cursor:pointer; }
.course-item:active { background:#1a1a1a; }
.course-icon { font-size:20px; flex-shrink:0; }
.course-info { flex:1; min-width:0; }
.course-name { font-size:14px; font-weight:600; color:#f0f0f5; }
.course-count { font-size:11px; color:#555; margin-top:2px; }
.course-actions { display:flex; gap:6px; }
.icon-btn { background:none; border:none; color:#555; font-size:16px; cursor:pointer; padding:4px; }
.add-course-btn { background:#111; border:1px dashed #333; border-radius:12px; padding:14px 16px; display:flex; align-items:center; gap:10px; cursor:pointer; color:#555; font-size:13px; margin-bottom:8px; }
.bottom-bar { background:#111; border-top:1px solid #222; padding:10px 14px; display:flex; gap:8px; flex-shrink:0; }
.bottom-bar .btn { flex:1; }

/* ── 입력 화면 ── */
#inputScreen .top-bar { background:#111; border-bottom:1px solid #222; padding:8px 12px; display:flex; align-items:center; gap:8px; flex-shrink:0; flex-wrap:wrap; }
.date-input { background:#1a1a1a; border:1px solid #2a2a2a; border-radius:8px; padding:5px 10px; color:#f0f0f5; font-size:12px; outline:none; }
#inputScreen .table-wrap { flex:1; overflow:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:none; touch-action:pan-x pan-y; padding-bottom:60px; }
table { border-collapse:collapse; min-width:max-content; }
thead th { position:sticky; top:0; background:#111; z-index:10; padding:7px 3px; font-size:11px; color:#fff; border-bottom:1px solid #fff; white-space:nowrap; text-align:center; }
thead th.th-seq { position:sticky; top:0; left:0; z-index:21; background:#111; padding:7px 4px; text-align:center; width:26px; min-width:26px; max-width:26px; color:#fff; font-size:10px; }
thead th.th-client { position:sticky; top:0; left:26px; z-index:20; background:#111; padding:7px 8px; text-align:left; min-width:90px; max-width:90px; width:90px; }
td { border-bottom:1px solid #fff; padding:3px 2px; text-align:center; vertical-align:middle; }
td.td-seq { position:sticky; left:0; background:#0d0d0d; z-index:6; padding:6px 2px; width:26px; min-width:26px; max-width:26px; text-align:center; vertical-align:middle; font-size:10px; color:#fff; border-right:none; }
td.td-client { position:sticky; left:26px; background:#0d0d0d; z-index:5; padding:6px 8px; border-right:1px solid #1e1e1e; min-width:90px; max-width:90px; width:90px; text-align:left; vertical-align:top; cursor:pointer; }
td.td-client:active { background:#151515; }
.client-seq { font-size:10px; color:#444; margin-right:3px; }
.client-name { font-size:11px; color:#e0e0e0; font-weight:500; word-break:break-all; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; max-height:30px; }
.client-prev-memo { font-size:10px; color:#a87a20; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100px; }
.client-today-memo { font-size:10px; color:#27ae60; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100px; }
td input[type=number] { width:34px; background:#1a1a1a !important; border:1px solid #444 !important; border-radius:5px; padding:4px 2px; color:#f0f0f5 !important; font-size:13px; text-align:center; outline:none; -moz-appearance:textfield; touch-action:manipulation; }
td input[type=number]::-webkit-inner-spin-button,
td input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; }
td input[type=number]:focus { border-color:#3D82F6; background:#111; }
td input[type=number]::placeholder { color:#2a2a2a; }
.sep-col { border-left:2px solid #2a2a2a; }
#inputScreen .action-bar { background:#111; border-top:1px solid #222; padding:8px 12px; display:flex; gap:8px; flex-shrink:0; }
#inputScreen .action-bar .btn { flex:1; }

/* ── 이전 데이터 ── */
#historyScreen .scroll { flex:1; overflow-y:auto; padding:12px; }
.history-item { background:#111; border:1px solid #222; border-radius:10px; padding:12px 14px; margin-bottom:8px; }
.history-date { font-size:12px; color:#555; margin-bottom:6px; }
.history-list { font-size:13px; color:#aaa; line-height:1.8; }

/* ── 모달 ── */
.modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:100; justify-content:center; align-items:center; }
.modal-bg.show { display:flex; }
.modal { background:#111; border:1px solid #222; border-radius:16px; padding:24px; width:90%; max-width:340px; position:relative; max-height:85vh; overflow-y:auto; }
.modal h3 { font-size:15px; margin-bottom:14px; }
.modal-close { position:absolute; top:12px; right:14px; background:none; border:none; color:#555; font-size:20px; cursor:pointer; }
.modal textarea { width:100%; background:#1a1a1a; border:1px solid #2a2a2a; border-radius:8px; padding:10px; color:#f0f0f5; font-size:14px; resize:none; outline:none; }
.modal textarea:focus { border-color:#3D82F6; }

/* 코스 편집 모달 리스트 */
.edit-item { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid #1e1e1e; }
.drag-handle { font-size:18px; color:#333; cursor:grab; padding:0 4px; flex-shrink:0; }
.edit-item-name { flex:1; font-size:13px; color:#ddd; }

/* 자동완성 */
.ac-wrap { position:relative; margin-bottom:10px; }
.ac-list { display:none; position:absolute; top:100%; left:0; right:0; background:#1e1e28; border:1px solid #333; border-radius:8px; z-index:50; max-height:180px; overflow-y:auto; margin-top:3px; }
.ac-item { padding:10px 12px; font-size:13px; cursor:pointer; border-bottom:1px solid #252535; color:#ddd; }
.ac-item:last-child { border-bottom:none; }
.ac-item:active { background:#252535; }

/* 토스트 */
.toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:#1e1e2e; border:1px solid #333; border-radius:10px; padding:10px 20px; font-size:13px; color:#f0f0f5; z-index:200; display:none; white-space:nowrap; }
.toast.show { display:block; }

/* 로그아웃 팝업 */
#exitModal .modal { text-align:center; max-width:280px; }
</style>
</head>
<body>

<!-- 로그인 -->
<div class="screen active" id="loginScreen">
  <div class="login-box">
    <div class="login-logo">🚛</div>
    <div class="login-title">수거 일지</div>
    <div class="login-sub">엔비텍코리아 서울지점</div>
    <input id="loginId" class="inp" type="text" placeholder="아이디" autocomplete="off">
    <input id="loginPw" class="inp" type="password" placeholder="비밀번호" inputmode="numeric" maxlength="4">
    <label class="save-id"><input type="checkbox" id="saveIdChk"> 아이디 저장</label>
    <button class="btn btn-primary" style="width:100%;padding:13px" onclick="doLogin()">로그인</button>
    <div class="login-err" id="loginErr">아이디 또는 비밀번호가 올바르지 않습니다.</div>
  </div>
</div>

<!-- 코스 목록 (메인) -->
<div class="screen" id="courseListScreen">
  <div class="hdr">
    <div>
      <div class="hdr-title">🚛 수거 일지</div>
      <div class="hdr-sub" id="mainUserLabel"></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-secondary btn-sm" onclick="showHistory()">이전 데이터</button>
      <button class="btn btn-secondary btn-sm" onclick="doLogout()">로그아웃</button>
    </div>
  </div>
  <div class="scroll" id="courseListWrap"></div>
  <div class="bottom-bar">
    <button class="btn btn-secondary" onclick="openAddCourseModal()">+ 코스 추가</button>
  </div>
</div>

<!-- 입력 화면 -->
<div class="screen" id="inputScreen">
  <div class="hdr">
    <div>
      <div class="hdr-title" id="inputScreenTitle">입력</div>
      <div class="hdr-sub" id="inputScreenSub"></div>
    </div>
    <button class="btn btn-secondary btn-sm" onclick="backToList()">← 목록</button>
  </div>
  <div class="top-bar">
    <input type="date" id="inputDate" class="date-input">
    <button class="btn btn-secondary btn-sm" onclick="openEditCourseModal()">코스 편집</button>
  </div>
  <div class="table-wrap">
    <table id="inputTable">
      <thead>
        <tr>
          <th class="th-seq" rowspan="2">#</th>
          <th class="th-client" rowspan="2">거래처</th>
          <th colspan="5" style="border-left:2px solid #2a2a2a">수거 박스</th>
          <th colspan="5" style="border-left:2px solid #2a2a2a">수거 합성</th>
          <th colspan="5" style="border-left:2px solid #2a2a2a">납품 박스</th>
          <th colspan="5" style="border-left:2px solid #2a2a2a">납품 합성</th>
        </tr>
        <tr id="subHeaderRow"></tr>
      </thead>
      <tbody id="inputTableBody"></tbody>
    </table>
  </div>
  <div class="action-bar">
    <button class="btn btn-secondary" onclick="saveTmp()">임시저장</button>
    <button class="btn btn-primary" onclick="sendData()">전송</button>
  </div>
</div>

<!-- 이전 데이터 -->
<div class="screen" id="historyScreen">
  <div class="hdr">
    <div><div class="hdr-title">이전 데이터</div></div>
    <button class="btn btn-secondary btn-sm" onclick="showScreen('courseListScreen')">← 뒤로</button>
  </div>
  <div style="padding:12px;flex-shrink:0;display:flex;gap:8px;align-items:center;border-bottom:1px solid #222">
    <input type="date" id="historyDate" class="date-input" style="flex:1">
    <button class="btn btn-primary btn-sm" onclick="loadHistory()">불러오기</button>
  </div>
  <div class="scroll" id="historyWrap">
    <div style="padding:20px;text-align:center;color:#444">날짜를 선택하고 불러오기를 눌러주세요</div>
  </div>
</div>

<!-- 모달들 -->
<!-- 코스 추가 -->
<div class="modal-bg" id="addCourseModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('addCourseModal')">✕</button>
    <h3>코스 추가</h3>
    <input id="newCourseName" class="inp" type="text" placeholder="코스 이름 (예: 중구 오전)" style="margin-bottom:12px">
    <button class="btn btn-primary" style="width:100%" onclick="addCourse()">추가</button>
  </div>
</div>

<!-- 코스 편집 (거래처 추가/순서변경) -->
<div class="modal-bg" id="editCourseModal">
  <div class="modal" style="display:flex;flex-direction:column;padding:16px;">
    <button class="modal-close" onclick="closeModal('editCourseModal')">✕</button>
    <h3 id="editCourseTitle" style="margin-bottom:10px">코스 편집</h3>
    <div class="ac-wrap" style="flex-shrink:0">
      <input id="courseSearch" class="inp" type="text" placeholder="거래처 검색 (초성 가능)" autocomplete="off" oninput="courseAcFilter()" style="margin-bottom:0">
      <div class="ac-list" id="courseAcList"></div>
    </div>
    <div id="editCourseList" style="overflow-y:auto;margin:10px 0;max-height:45vh;min-height:80px"></div>
    <button class="btn btn-primary" style="width:100%;flex-shrink:0" onclick="saveEditCourse()">저장</button>
  </div>
</div>

<!-- 메모 -->
<div class="modal-bg" id="memoModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('memoModal')">✕</button>
    <h3 id="memoModalTitle" style="font-size:13px;margin-bottom:6px"></h3>
    <div id="memoPrevText" style="font-size:11px;color:#a87a20;margin-bottom:10px"></div>
    <textarea id="memoInput" rows="3" placeholder="오늘 메모..."></textarea>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn btn-danger btn-sm" onclick="deleteMemo()">삭제</button>
      <button class="btn btn-primary" style="flex:1" onclick="saveMemo()">저장</button>
    </div>
  </div>
</div>

<!-- 전송 완료 팝업 -->
<div class="modal-bg" id="doneModal">
  <div class="modal" style="text-align:center">
    <div style="font-size:32px;margin-bottom:10px">✅</div>
    <div style="font-size:15px;font-weight:700;margin-bottom:6px">전송 완료!</div>
    <div id="doneCount" style="font-size:13px;color:#555;margin-bottom:14px"></div>
    <div id="doneList" style="text-align:left;font-size:12px;color:#888;max-height:200px;overflow-y:auto;margin-bottom:16px;border:1px solid #222;border-radius:8px;padding:10px"></div>
    <button class="btn btn-primary" style="width:100%" onclick="closeDone()">확인</button>
  </div>
</div>

<!-- 로그아웃 확인 -->
<div class="modal-bg" id="exitModal">
  <div class="modal" style="text-align:center;max-width:260px">
    <div style="font-size:24px;margin-bottom:10px">👋</div>
    <div style="font-size:15px;margin-bottom:20px">로그아웃 하시겠어요?</div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-secondary" style="flex:1" onclick="closeModal('exitModal')">아니요</button>
      <button class="btn btn-primary" style="flex:1" onclick="confirmLogout()">네</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, doc, getDocs, query, where, getDoc, setDoc, deleteDoc, Timestamp, orderBy }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCka6GbEUJBUf-5BFxvD0O-Hv9dS-T3Big",
  authDomain: "jypenvitec.firebaseapp.com",
  projectId: "jypenvitec",
  storageBucket: "jypenvitec.appspot.com",
  messagingSenderId: "760975820830",
  appId: "1:760975820830:web:8b20d40a3d1cf3a1f8e9de"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ── 상수 ──
const SIZES = ['4L','12L','30L','50L','63L','1L','2L','5L','10L','20L'];
const BOX_SIZES = ['4L','12L','30L','50L','63L'];
const RESIN_SIZES = ['1L','2L','5L','10L','20L'];
const DEFAULT_COURSES = [
  {key:'A월', name:'A월요일'}, {key:'A화', name:'A화요일'}, {key:'A수', name:'A수요일'}, {key:'A목', name:'A목요일'}, {key:'A금', name:'A금요일'},
  {key:'B월', name:'B월요일'}, {key:'B화', name:'B화요일'}, {key:'B수', name:'B수요일'}, {key:'B목', name:'B목요일'}, {key:'B금', name:'B금요일'},
];

// ── 상태 ──
let currentUser = null;
let allClients = [];
let courseList = []; // [{id, name, clients:[]}]
let currentCourse = null; // 현재 선택된 코스
let inputCache = {}; // {idx: {collect:{}, deliver:{}, memo:''}}
let memoCache = {}; // {clientName: memo}
let editTempClients = []; // 코스 편집 임시
let memoIdx = -1;

// ── 유틸 ──
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function toast(msg, type='success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderColor = type === 'success' ? '#27ae60' : '#e74c3c';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

window.closeModal = function(id) {
  document.getElementById(id).classList.remove('show');
};

// ── 초성 ──
const CS = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
function getCS(str) {
  return [...str].map(c => {
    const n = c.charCodeAt(0);
    return (n >= 0xAC00 && n <= 0xD7A3) ? CS[Math.floor((n-0xAC00)/(21*28))] : c;
  }).join('');
}

// ── 로그인 ──
window.doLogin = async function() {
  const id = document.getElementById('loginId').value.trim();
  const pw = document.getElementById('loginPw').value.trim();
  document.getElementById('loginErr').style.display = 'none';
  try {
    const adminDoc = await getDoc(doc(db,'adminConfig','auth'));
    if (id === 'admin' && adminDoc.exists() && adminDoc.data().password === pw) {
      currentUser = { type:'admin', name:'관리자', userId:'admin', cars:[] };
      if (document.getElementById('saveIdChk').checked) localStorage.setItem('daily2_savedId', id);
      else localStorage.removeItem('daily2_savedId');
      localStorage.setItem('daily2_session', JSON.stringify(currentUser));
      startApp();
      for (let i=0;i<5;i++) history.pushState(null,'',location.href);
      return;
    }
    const snap = await getDocs(query(collection(db,'users'), where('userId','==',id)));
    for (const ud of snap.docs) {
      if (ud.data().password === pw) {
        currentUser = { type:'vehicle', userId:id, name:ud.data().name||'', docId:ud.id, cars:ud.data().cars||[] };
        if (document.getElementById('saveIdChk').checked) localStorage.setItem('daily2_savedId', id);
        else localStorage.removeItem('daily2_savedId');
        localStorage.setItem('daily2_session', JSON.stringify(currentUser));
        startApp();
        for (let i=0;i<5;i++) history.pushState(null,'',location.href);
        return;
      }
    }
  } catch(e) { console.error(e); }
  document.getElementById('loginErr').style.display = 'block';
};

document.getElementById('loginId').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('loginPw').focus(); });
document.getElementById('loginPw').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

// ── 앱 시작 ──
async function startApp() {
  document.getElementById('mainUserLabel').textContent = currentUser.name || currentUser.userId;
  document.getElementById('inputDate').value = today();
  document.getElementById('historyDate').value = today();

  // 거래처 목록 로드
  try {
    const snap = await getDocs(collection(db,'clients'));
    allClients = snap.docs.map(d=>d.data().name).filter(Boolean).sort();
  } catch(e) { allClients = []; }

  await loadCourseList();
  showScreen('courseListScreen');
}

// ── 코스 목록 로드 ──
async function loadCourseList() {
  courseList = [];
  // 기본 코스 (A/B 주차 각 5일)
  for (const dc of DEFAULT_COURSES) {
    const key = currentUser.userId + '_day_' + dc.key;
    try {
      const snap = await getDoc(doc(db,'courses2', key));
      const clients = snap.exists() ? (snap.data().clients||[]) : [];
      courseList.push({ id:key, name:dc.name, type:'default', day:dc.key, clients });
    } catch(e) {
      courseList.push({ id:key, name:dc.name, type:'default', day:dc.key, clients:[] });
    }
  }
  // 추가 코스
  try {
    const snap = await getDocs(query(collection(db,'courses2'), where('userId','==',currentUser.userId), where('type','==','custom')));
    snap.docs.forEach(d => {
      courseList.push({ id:d.id, name:d.data().name, type:'custom', clients:d.data().clients||[] });
    });
  } catch(e) {}
  renderCourseList();
}

function renderCourseList() {
  const wrap = document.getElementById('courseListWrap');
  let html = '';

  // 기본 코스 A주차
  html += '<div class="section-label">A주차</div>';
  courseList.filter(c=>c.type==='default' && c.day.startsWith('A')).forEach(c => {
    html += `<div class="course-item" onclick="selectCourse('${c.id}')">
      <div class="course-icon">📅</div>
      <div class="course-info">
        <div class="course-name">${c.name}</div>
        <div class="course-count">${c.clients.length}개 거래처</div>
      </div>
    </div>`;
  });

  // 기본 코스 B주차
  html += '<div class="section-label">B주차</div>';
  courseList.filter(c=>c.type==='default' && c.day.startsWith('B')).forEach(c => {
    html += `<div class="course-item" onclick="selectCourse('${c.id}')">
      <div class="course-icon">📅</div>
      <div class="course-info">
        <div class="course-name">${c.name}</div>
        <div class="course-count">${c.clients.length}개 거래처</div>
      </div>
    </div>`;
  });

  // 추가 코스
  const custom = courseList.filter(c=>c.type==='custom');
  if (custom.length) {
    html += '<div class="section-label">추가 코스</div>';
    custom.forEach(c => {
      html += `<div class="course-item" onclick="selectCourse('${c.id}')">
        <div class="course-icon">📋</div>
        <div class="course-info">
          <div class="course-name">${c.name}</div>
          <div class="course-count">${c.clients.length}개 거래처</div>
        </div>
        <div class="course-actions">
          <button class="icon-btn" onclick="event.stopPropagation();deleteCourse('${c.id}')">🗑️</button>
        </div>
      </div>`;
    });
  }

  wrap.innerHTML = html;
}

// ── 코스 선택 ──
window.selectCourse = async function(id) {
  currentCourse = courseList.find(c=>c.id===id);
  if (!currentCourse) return;
  document.getElementById('inputScreenTitle').textContent = currentCourse.name;
  document.getElementById('inputScreenSub').textContent = currentUser.name + ' · ' + today();

  // 임시저장 불러오기
  const tmpKey = currentUser.userId + '_' + id + '_tmp';
  try {
    const snap = await getDoc(doc(db,'dailyTemp2', tmpKey));
    if (snap.exists() && snap.data().clients && snap.data().clients.length > 0) {
      currentCourse.clients = snap.data().clients;
      inputCache = snap.data().cache || {};
    } else {
      inputCache = {};
    }
  } catch(e) { inputCache = {}; }

  await loadMemos();
  renderSubHeader();
  renderInputTable();
  showScreen('inputScreen');
};

// ── 메모 로드 ──
async function loadMemos() {
  memoCache = {};
  for (const name of currentCourse.clients) {
    try {
      const snap = await getDocs(query(collection(db,'일지db'), where('clientName','==',name)));
      if (!snap.empty) {
        const docs = snap.docs.map(d=>d.data()).filter(d=>d.memo);
        if (docs.length) {
          docs.sort((a,b)=>(b.timestamp?.seconds||0)-(a.timestamp?.seconds||0));
          memoCache[name] = docs[0].memo;
        }
      }
    } catch(e) {}
  }
}

// ── 입력 테이블 렌더 ──
function saveCurrentInputs() {
  if (!currentCourse) return;
  currentCourse.clients.forEach((name, idx) => {
    const row = document.querySelector(`tr[data-idx="${idx}"]`);
    if (!row) return;
    if (!inputCache[idx]) inputCache[idx] = { collect:{}, deliver:{}, memo:'' };
    SIZES.forEach(sz => {
      const c = row.querySelector(`[data-type="c"][data-key="${sz}"]`);
      const d = row.querySelector(`[data-type="d"][data-key="${sz}"]`);
      if (c) inputCache[idx].collect[sz] = c.value;
      if (d) inputCache[idx].deliver[sz] = d.value;
    });
  });
}

function renderInputTable() {
  const tbody = document.getElementById('inputTableBody');
  if (!currentCourse || !currentCourse.clients.length) {
    tbody.innerHTML = '<tr><td colspan="41" style="padding:20px;text-align:center;color:#444">코스를 편집해서 거래처를 추가해주세요</td></tr>';
    return;
  }
  let html = '';
  currentCourse.clients.forEach((name, idx) => {
    const cache = inputCache[idx] || { collect:{}, deliver:{}, memo:'' };
    html += `<tr data-idx="${idx}">`;
    html += `<td class="td-seq">${idx+1}</td><td class="td-client" onclick="openMemoModal(${idx})">
      <div><span class="client-name" style="${memoCache[name] ? 'color:#90EE90' : ''}">${name}</span></div>
      ${cache.memo ? `<div class="client-today-memo">📝 ${cache.memo}</div>` : ''}
    </td>`;
    // 수거 박스 (4,12,30,50,63) - 연한 베이지
    // 수거 박스
    BOX_SIZES.forEach((sz, i) => {
      const v = cache.collect[sz] || '';
      const bg = sz==='30L' ? '#2a2218' : '#221e14';
      const border = i===0 ? 'border-left:2px solid #2a2a2a;' : '';
      html += `<td style="${border}background:${bg}">
        <input type="number" placeholder="" data-type="c" data-key="${sz}" min="0" value="${v}" inputmode="numeric">
      </td>`;
    });
    // 수거 합성
    RESIN_SIZES.forEach((sz, i) => {
      const v = cache.collect[sz] || '';
      const bg = sz==='5L' ? '#1e2a18' : '#182014';
      const border = i===0 ? 'border-left:2px solid #2a2a2a;' : '';
      html += `<td style="${border}background:${bg}">
        <input type="number" placeholder="" data-type="c" data-key="${sz}" min="0" value="${v}" inputmode="numeric">
      </td>`;
    });
    // 납품 박스
    BOX_SIZES.forEach((sz, i) => {
      const v = cache.deliver[sz] || '';
      const bg = sz==='30L' ? '#18202a' : '#141820';
      const border = i===0 ? 'border-left:2px solid #2a2a2a;' : '';
      html += `<td style="${border}background:${bg}">
        <input type="number" placeholder="" data-type="d" data-key="${sz}" min="0" value="${v}" inputmode="numeric">
      </td>`;
    });
    // 납품 합성
    RESIN_SIZES.forEach((sz, i) => {
      const v = cache.deliver[sz] || '';
      const bg = sz==='5L' ? '#1e1828' : '#181420';
      const border = i===0 ? 'border-left:2px solid #2a2a2a;' : '';
      html += `<td style="${border}background:${bg}">
        <input type="number" placeholder="" data-type="d" data-key="${sz}" min="0" value="${v}" inputmode="numeric">
      </td>`;
    });
    html += '</tr>';
  });
  tbody.innerHTML = html;
}

// ── 전송 ──
window.sendData = async function() {
  saveCurrentInputs();
  const date = document.getElementById('inputDate').value || today();
  const carNumber = currentUser.cars?.[0] || '';
  let count = 0;
  const sentClients = [];
  const baseTime = Date.now();

  for (let idx=0; idx<currentCourse.clients.length; idx++) {
    const name = currentCourse.clients[idx];
    const cache = inputCache[idx] || { collect:{}, deliver:{}, memo:'' };
    const data = { clientName:name, date, carNumber, seq:idx+1, memo:cache.memo||'', timestamp:Timestamp.fromMillis(baseTime+idx*1000) };
    let hasData = false;
    SIZES.forEach(sz => {
      const cv = parseInt(cache.collect[sz])||0;
      const dv = parseInt(cache.deliver[sz])||0;
      if (cv>0||dv>0) hasData = true;
      data['collect'+sz] = cv;
      data['deliver'+sz] = dv;
    });
    if (cache.memo) hasData = true;
    if (!hasData) continue;
    try {
      await addDoc(collection(db,'일지db'), data);
      sentClients.push(name);
      count++;
    } catch(e) {}
  }

  if (count === 0) { toast('입력된 데이터가 없어요', 'error'); return; }

  // 임시저장 삭제
  const tmpKey = currentUser.userId + '_' + currentCourse.id + '_tmp';
  try { await deleteDoc(doc(db,'dailyTemp2', tmpKey)); } catch(e) {}

  // 전송 완료 팝업
  inputCache = {};
  document.getElementById('doneCount').textContent = `${count}건 전송됐어요`;
  document.getElementById('doneList').innerHTML = sentClients.map((n,i) => `<div style="padding:3px 0;border-bottom:1px solid #1e1e1e">${i+1}. ${n}</div>`).join('');
  document.getElementById('doneModal').classList.add('show');
  renderInputTable();
};

function renderEditList() {
  const el = document.getElementById('editCourseList');
  if (!editTempClients.length) {
    el.innerHTML = '<div style="padding:10px;color:#444;font-size:12px">거래처를 검색해서 추가하세요</div>';
    return;
  }
  el.innerHTML = editTempClients.map((name, i) => `
    <div class="edit-item" data-idx="${i}" style="user-select:none;-webkit-user-select:none">
      <span class="edit-item-name">${i+1}. ${name}</span>
      <button onclick="removeEditClient(${i})" style="background:none;border:none;color:#555;font-size:15px;cursor:pointer;padding:4px;flex-shrink:0">✕</button>
    </div>
  `).join('');
  initEditDrag();
}

function initEditDrag() {
  const items = document.querySelectorAll('#editCourseList .edit-item');
  let dragIdx = null, startY = 0, currentY = 0, itemH = 44, longPressTimer = null, dragging = false, ghost = null;

  function createGhost(name, y) {
    ghost = document.createElement('div');
    ghost.textContent = name;
    ghost.style.cssText = `position:fixed;left:10%;width:80%;background:#3D82F6;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;z-index:9999;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,0.5);top:${y-20}px;`;
    document.body.appendChild(ghost);
  }

  function removeGhost() {
    if (ghost) { ghost.remove(); ghost = null; }
  }

  items.forEach(item => {
    item.addEventListener('touchstart', e => {
      const idx = parseInt(item.dataset.idx);
      longPressTimer = setTimeout(() => {
        dragIdx = idx;
        dragging = true;
        startY = e.touches[0].clientY;
        currentY = startY;
        const list = document.getElementById('editCourseList');
        list._startScroll = list.scrollTop;
        item.style.opacity = '0.3';
        if(navigator.vibrate) navigator.vibrate(40);
        createGhost(editTempClients[idx], startY);
      }, 400);
    }, { passive:true });

    item.addEventListener('touchmove', e => {
      if (!dragging || dragIdx === null) { clearTimeout(longPressTimer); return; }
      e.preventDefault();
      currentY = e.touches[0].clientY;
      // ghost 이동
      if (ghost) ghost.style.top = (currentY - 20) + 'px';
      // 자동 스크롤
      const list = document.getElementById('editCourseList');
      const rect = list.getBoundingClientRect();
      if (currentY > rect.bottom - 40) list.scrollTop += 3;
      else if (currentY < rect.top + 40) list.scrollTop -= 3;
      const diff = currentY - startY + list.scrollTop - (list._startScroll || 0);
      const steps = Math.round(diff / itemH);
      const newIdx = Math.max(0, Math.min(editTempClients.length-1, dragIdx + steps));
      const allItems = [...document.querySelectorAll('#editCourseList .edit-item')];
      allItems.forEach((el, i) => {
        el.style.transition = 'transform 0.15s';
        if (i === dragIdx) { el.style.transform = ''; return; }
        if (dragIdx < newIdx && i > dragIdx && i <= newIdx) el.style.transform = 'translateY(-44px)';
        else if (dragIdx > newIdx && i >= newIdx && i < dragIdx) el.style.transform = 'translateY(44px)';
        else el.style.transform = '';
      });
    }, { passive:false });

    item.addEventListener('touchend', e => {
      clearTimeout(longPressTimer);
      removeGhost();
      if (!dragging || dragIdx === null) { dragging = false; return; }
      const diff = currentY - startY;
      const steps = Math.round(diff / itemH);
      const newIdx = Math.max(0, Math.min(editTempClients.length-1, dragIdx + steps));
      if (newIdx !== dragIdx) {
        const moved = editTempClients.splice(dragIdx, 1)[0];
        editTempClients.splice(newIdx, 0, moved);
      }
      dragIdx = null;
      dragging = false;
      renderEditList();
    });
  });
}

window.removeEditClient = function(idx) {
  editTempClients.splice(idx, 1);
  renderEditList();
};

window.loadHistory = async function() {
  const date = document.getElementById('historyDate').value;
  if (!date) return;
  const carNumber = currentUser.cars?.[0] || '';
  const wrap = document.getElementById('historyWrap');
  wrap.innerHTML = '<div style="padding:20px;text-align:center;color:#444">불러오는 중...</div>';
  try {
    const q = carNumber
      ? query(collection(db,'일지db'), where('date','==',date), where('carNumber','==',carNumber), where('seq','>=',1))
      : query(collection(db,'일지db'), where('date','==',date), where('seq','>=',1));
    const snap = await getDocs(q);
    if (snap.empty) { wrap.innerHTML = '<div style="padding:20px;text-align:center;color:#444">데이터가 없어요</div>'; return; }
    const docs = snap.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(a.seq||0)-(b.seq||0));
    wrap.innerHTML = docs.map(d => {
      const items = SIZES.map(sz => {
        const cv = d['collect'+sz]||0, dv = d['deliver'+sz]||0;
        if (!cv && !dv) return null;
        return `${sz}: 수${cv}/납${dv}`;
      }).filter(Boolean).join(', ');
      return `<div class="history-item">
        <div class="history-date">${d.seq}. ${d.clientName}</div>
        <div class="history-list">${items || '내용 없음'}${d.memo ? '<br>📝 '+d.memo : ''}</div>
      </div>`;
    }).join('') + `<div style="padding:12px;text-align:center">
      <button class="btn btn-primary" onclick="editHistory('${date}')">편집하기</button>
    </div>`;
  } catch(e) { wrap.innerHTML = '<div style="padding:20px;text-align:center;color:#e74c3c">불러오기 실패</div>'; }
};

window.editHistory = async function(date) {
  // 임시 코스 만들어서 입력 화면으로
  const carNumber = currentUser.cars?.[0] || '';
  const q = carNumber
    ? query(collection(db,'일지db'), where('date','==',date), where('carNumber','==',carNumber), where('seq','>=',1))
    : query(collection(db,'일지db'), where('date','==',date), where('seq','>=',1));
  const snap = await getDocs(q);
  const docs = snap.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(a.seq||0)-(b.seq||0));
  currentCourse = { id:'_history_'+date, name:date+' 수정', type:'history', clients:docs.map(d=>d.clientName) };
  inputCache = {};
  docs.forEach((d, idx) => {
    inputCache[idx] = { collect:{}, deliver:{}, memo:d.memo||'' };
    SIZES.forEach(sz => {
      inputCache[idx].collect[sz] = d['collect'+sz] ? String(d['collect'+sz]) : '';
      inputCache[idx].deliver[sz] = d['deliver'+sz] ? String(d['deliver'+sz]) : '';
    });
  });
  document.getElementById('inputDate').value = date;
  document.getElementById('inputScreenTitle').textContent = date + ' 수정';
  document.getElementById('inputScreenSub').textContent = currentUser.name;
  await loadMemos();
  renderSubHeader();
  renderInputTable();
  showScreen('inputScreen');
};

};

window.confirmLogout = function() {
  currentUser = null;
  localStorage.removeItem('daily2_session');
  closeModal('exitModal');
  showScreen('loginScreen');
  history.go(-(history.length-1));
};

// ── 뒤로가기 ──
let _blocking = false, _exitOpen = false;
history.pushState(null,'',location.href);
history.pushState(null,'',location.href);
history.pushState(null,'',location.href);

window.addEventListener('popstate', () => {
  if (!currentUser) return;
  if (_blocking) return;
  _blocking = true;
  history.go(1);
  setTimeout(() => { _blocking = false; }, 100);
  if (_exitOpen) { closeModal('exitModal'); _exitOpen = false; return; }
  _exitOpen = true;
  document.getElementById('exitModal').classList.add('show');
});

document.getElementById('exitModal').querySelector('.btn-secondary').addEventListener('click', () => { _exitOpen = false; });

// ── 세션 복원 ──
history.pushState(null,'',location.href);
history.pushState(null,'',location.href);
history.pushState(null,'',location.href);

(async function() {
  // 아이디 저장
  const savedId = localStorage.getItem('daily2_savedId');
  if (savedId) {
    document.getElementById('loginId').value = savedId;
    document.getElementById('saveIdChk').checked = true;
  }
  const session = localStorage.getItem('daily2_session');
  if (session) {
    try {
      currentUser = JSON.parse(session);
      await startApp();
      for (let i=0;i<5;i++) history.pushState(null,'',location.href);
    } catch(e) { localStorage.removeItem('daily2_session'); }
  }
})();

</script>
</body>
