    <style>
        body { background-color: #121216; color: #ffffff; font-family: sans-serif; padding: 25px; }

        input { padding: 6px; font-size: 14px; border-radius: 4px; border: 1px solid #555; background: #2A2A32; color: white; margin-right: 15px; }
        button { background-color: #3B82F6; color: white; border: none; padding: 10px 18px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-right: 10px; }
        button:hover { background-color: #2563EB; }
        .btn-excel { background-color: #22C55E; }
        .btn-excel:hover { background-color: #16a34a; }
        .btn-download { background-color: #F59E0B; }
        .btn-download:hover { background-color: #D97706; }

        .table-container { width: 100%; overflow-x: auto; }
        select { padding: 6px; font-size: 14px; border-radius: 4px; border: 1px solid #555; background: #2A2A32; color: white; margin-right: 15px; }
        table { width: max-content; border-collapse: collapse; margin-top: 15px; white-space: nowrap; }
        th, td { border: 1px solid #444; padding: 6px 10px; text-align: center; font-size: 12px; }
        th { background-color: #2A2A32; position: sticky; top: 0; z-index: 10; }
        #status { margin-top: 10px; font-weight: bold; color: #60A5FA; }
        .row-subtotal { background-color: #2A3A2A; font-weight: bold; color: #86EFAC; }
        .row-total { background-color: #1E2A3A; font-weight: bold; color: #93C5FD; font-size: 13px; }
        .summary-box { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
        .summary-chip { background: #2A2A32; border-radius: 8px; padding: 6px 14px; font-size: 13px; color: #D1D5DB; }
        .summary-chip span { font-weight: bold; color: #60A5FA; }
    </style>

<style>
  #loginScreen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; background:#121216; }

  .login-input:focus { border-color:#3D82F6; }

        // 부분일치 + 공백 제거 방식으로 코드 찾기
        function findClientCode(clientName) {
            if (!clientName) return '';
            const normalize = s => s.replace(/\s/g, '').toLowerCase();
            const target = normalize(clientName);
            // 1. 정확히 일치
            for (const [name, code] of clientCodeList) {
                if (normalize(name) === target) return code;
            }
            // 2. 리스트 이름이 입력 이름을 포함하는 경우 (짧은 매칭 우선)
            let best = null;
            let bestLen = Infinity;
            for (const [name, code] of clientCodeList) {
                const normName = normalize(name);
                if (target.includes(normName) || normName.includes(target)) {
                    if (normName.length < bestLen) {
                        best = code;
                        bestLen = normName.length;
                    }
                }
            }
            return best || '';
        }

        let loadedItemList = [];
        
        const today = new Date().toISOString().substring(0, 10);
        document.getElementById('startDate').value = today;
        document.getElementById('endDate').value = today;

        const COLLECT_FIELDS = ['collect4L','collect12L','collect30L','collect50L','collect63L','collect1L','collect2L','collect5L','collect10L','collect20L'];
        const DELIVER_FIELDS = ['deliver4L','deliver12L','deliver30L','deliver50L','deliver63L','deliver1L','deliver2L','deliver5L','deliver10L','deliver20L'];

        function sumFields(item, fields) {
            return fields.reduce((s, f) => s + (Number(item[f]) || 0), 0);
        }

        function makeDataRow(item) {
            const clientName = item.clientName || '';
            const clientCode = item.clientCode || findClientCode(clientName) || '';
            const cv = f => item[f] || '';
            return `<tr>
                <td>${item.date || ''}</td>
                <td>${clientCode}</td>
                <td>${clientName}</td>
                <td>${cv('collect4L')}</td><td>${cv('collect12L')}</td><td>${cv('collect30L')}</td><td>${cv('collect50L')}</td><td>${cv('collect63L')}</td>
                <td>${cv('collect1L')}</td><td>${cv('collect2L')}</td><td>${cv('collect5L')}</td><td>${cv('collect10L')}</td><td>${cv('collect20L')}</td>
                <td>${cv('deliver4L')}</td><td>${cv('deliver12L')}</td><td>${cv('deliver30L')}</td><td>${cv('deliver50L')}</td><td>${cv('deliver63L')}</td>
                <td>${cv('deliver1L')}</td><td>${cv('deliver2L')}</td><td>${cv('deliver5L')}</td><td>${cv('deliver10L')}</td><td>${cv('deliver20L')}</td>
                <td>${item.memo || ''}</td>
            </tr>`;
        }

        function makeSubtotalRow(label, items) {
            const sum = f => items.reduce((s, it) => s + (Number(it[f]) || 0), 0);
            const sv = f => sum(f) || '';
            return `<tr class="row-subtotal">
                <td colspan="3">🚗 ${label} 소계 (${items.length}건)</td>
                <td>${sv('collect4L')}</td><td>${sv('collect12L')}</td><td>${sv('collect30L')}</td><td>${sv('collect50L')}</td><td>${sv('collect63L')}</td>
                <td>${sv('collect1L')}</td><td>${sv('collect2L')}</td><td>${sv('collect5L')}</td><td>${sv('collect10L')}</td><td>${sv('collect20L')}</td>
                <td>${sv('deliver4L')}</td><td>${sv('deliver12L')}</td><td>${sv('deliver30L')}</td><td>${sv('deliver50L')}</td><td>${sv('deliver63L')}</td>
                <td>${sv('deliver1L')}</td><td>${sv('deliver2L')}</td><td>${sv('deliver5L')}</td><td>${sv('deliver10L')}</td><td>${sv('deliver20L')}</td>
                <td></td>
            </tr>`;
        }

        function makeTotalRow(items) {
            const sum = f => items.reduce((s, it) => s + (Number(it[f]) || 0), 0);
            const sv = f => sum(f) || '';
            return `<tr class="row-total">
                <td colspan="3">📊 전체 합계 (${items.length}건)</td>
                <td>${sv('collect4L')}</td><td>${sv('collect12L')}</td><td>${sv('collect30L')}</td><td>${sv('collect50L')}</td><td>${sv('collect63L')}</td>
                <td>${sv('collect1L')}</td><td>${sv('collect2L')}</td><td>${sv('collect5L')}</td><td>${sv('collect10L')}</td><td>${sv('collect20L')}</td>
                <td>${sv('deliver4L')}</td><td>${sv('deliver12L')}</td><td>${sv('deliver30L')}</td><td>${sv('deliver50L')}</td><td>${sv('deliver63L')}</td>
                <td>${sv('deliver1L')}</td><td>${sv('deliver2L')}</td><td>${sv('deliver5L')}</td><td>${sv('deliver10L')}</td><td>${sv('deliver20L')}</td>
                <td></td>
            </tr>`;
        }

        function renderSummary(items, rangeLabel, targetCar) {
            const collectTotal = items.reduce((s, it) => s + sumFields(it, COLLECT_FIELDS), 0);
            const deliverTotal = items.reduce((s, it) => s + sumFields(it, DELIVER_FIELDS), 0);
            const carLabel = targetCar === '__ALL__' ? '전체 차량' : `차량 ${targetCar}`;
            document.getElementById('status').innerText = `✅ ${carLabel} [${rangeLabel}] | 총 ${items.length}건`;
            document.getElementById('summaryBox').innerHTML = `
                <div class="summary-chip">거래처 수: <span>${items.length}</span>건</div>
                <div class="summary-chip">수거 총합: <span>${collectTotal}</span>개</div>
                <div class="summary-chip">납품 총합: <span>${deliverTotal}</span>개</div>
            `;
        }

        window.loadFirebaseData = async function() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const targetCar = document.getElementById('carNumberFilter').value;
            const statusEl = document.getElementById('status');
            const previewBody = document.getElementById('previewBody');

            if (!startDate || !endDate || !targetCar) {
                alert("시작일, 종료일, 차량번호를 모두 선택해주세요.");
                return;
            }
            if (startDate > endDate) {
                alert("시작일이 종료일보다 늦을 수 없습니다.");
                return;
            }

            statusEl.innerText = "⏳ 파이어베이스에서 데이터를 불러오는 중...";
            document.getElementById('summaryBox').innerHTML = '';
            previewBody.innerHTML = `<tr><td colspan="25">불러오는 중...</td></tr>`;

            try {
                // 날짜 범위 + 차량번호를 Firestore 쿼리에서 직접 필터링 (전체 스캔 방지)
                let q;
                if (targetCar === '__ALL__') {
                    q = query(collection(db, "일지db"),
                        where("date", ">=", startDate),
                        where("date", "<=", endDate),
                        orderBy("date", "asc")
                    );
                } else {
                    q = query(collection(db, "일지db"),
                        where("date", ">=", startDate),
                        where("date", "<=", endDate),
                        where("carNumber", "==", targetCar),
                        orderBy("date", "asc")
                    );
                }
                const querySnapshot = await getDocs(q);
                const rangeLabel = startDate === endDate ? startDate : `${startDate} ~ ${endDate}`;

                loadedItemList = [];
                querySnapshot.forEach((doc) => {
                    loadedItemList.push(doc.data());
                });

                if (loadedItemList.length === 0) {
                    const carLabel = targetCar === '__ALL__' ? '전체 차량' : `차량 ${targetCar}`;
                    statusEl.innerText = `⚠️ [${rangeLabel}] / [${carLabel}]에 등록된 데이터가 없습니다.`;
                    previewBody.innerHTML = `<tr><td colspan="25" style="color: #888;">데이터가 없습니다.</td></tr>`;
                    return;
                }

                // 날짜+차량+timestamp 순 정렬
                loadedItemList.sort((a, b) => {
                    const ka = String(a.date||'') + String(a.carNumber||'') + String(a.timestamp||'');
                    const kb = String(b.date||'') + String(b.carNumber||'') + String(b.timestamp||'');
                    return ka.localeCompare(kb);
                });

                renderSummary(loadedItemList, rangeLabel, targetCar);

                previewBody.innerHTML = "";

                if (targetCar === '__ALL__') {
                    // 차량별 그룹화
                    const carGroups = {};
                    const carOrder = [];
                    loadedItemList.forEach(item => {
                        const cn = item.carNumber || '미지정';
                        if (!carGroups[cn]) { carGroups[cn] = []; carOrder.push(cn); }
                        carGroups[cn].push(item);
                    });
                    carOrder.forEach(cn => {
                        carGroups[cn].forEach(item => {
                            previewBody.innerHTML += makeDataRow(item);
                        });
                        previewBody.innerHTML += makeSubtotalRow(cn, carGroups[cn]);
                    });
                    previewBody.innerHTML += makeTotalRow(loadedItemList);
                } else {
                    loadedItemList.forEach(item => {
                        previewBody.innerHTML += makeDataRow(item);
                    });
                }

            } catch (error) {
                console.error(error);
                statusEl.innerText = "❌ 에러 발생: " + error.message;
                alert("불러오기 실패: " + error.message);
            }
        };

        window.downloadXlsx = function() {
            if (!loadedItemList || loadedItemList.length === 0) {

            const rows = loadedItemList.map(record => {
                const clientName = record.clientName || "";

                return [
                    record.date || "",

                    clientName,

                    record.collect1L || "", record.collect2L || "", record.collect5L || "", record.collect10L || "", record.collect20L || "",
                    record.deliver4L || "", record.deliver12L || "", record.deliver30L || "", record.deliver50L || "", record.deliver63L || "",
                    record.deliver1L || "", record.deliver2L || "", record.deliver5L || "", record.deliver10L || "", record.deliver20L || "",
                    record.salesBasic || "", record.salesSynth || "", record.salesAdd || "", record.salesTotal || "", record.discharge || "",
                    (record.memo || "").replace(/\n/g, " ")
                ];
            });

            const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "운행보고서");

            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const carNum = document.getElementById('carNumberFilter').value;
            const fileName = `운행보고서_${carNum}_${startDate}${startDate !== endDate ? '~' + endDate : ''}.xlsx`;

            XLSX.writeFile(wb, fileName);
        };

                alert("복사할 데이터가 없습니다. 먼저 데이터를 불러와주세요.");
                return;

            let tsvContent = "";

            loadedItemList.forEach(record => {
                const date = record.date || "";
                const clientName = record.clientName || "";
                const clientCode = findClientCode(clientName) || "";
                const memo = (record.memo || "").replace(/\n/g, " ");

                const collectBoxes = [
                    record.collect4L || "", record.collect12L || "", record.collect30L || "", record.collect50L || "", record.collect63L || ""
                ];
                const collectSynths = [
                    record.collect1L || "", record.collect2L || "", record.collect5L || "", record.collect10L || "", record.collect20L || ""
                ];
                const deliverBoxes = [
                    record.deliver4L || "", record.deliver12L || "", record.deliver30L || "", record.deliver50L || "", record.deliver63L || ""
                ];
                const deliverSynths = [
                    record.deliver1L || "", record.deliver2L || "", record.deliver5L || "", record.deliver10L || "", record.deliver20L || ""
                ];

                const salesBasic = record.salesBasic || "";
                const salesSynth = record.salesSynth || "";
                const salesAdd = record.salesAdd || "";
                const salesTotal = record.salesTotal || "";
                const discharge = record.discharge || "";

                const rowArray = [
                    date,
                    clientCode,
                    clientName,
                    ...collectBoxes,
                    ...collectSynths,
                    ...deliverBoxes,
                    ...deliverSynths,
                    salesBasic,
                    salesSynth,
                    salesAdd,
                    salesTotal,
                    discharge,
                    memo
                ];

                tsvContent += rowArray.join("\t") + "\n";
            });

            navigator.clipboard.writeText(tsvContent).then(() => {
                alert("📋 복사 완료! 엑셀 첫 번째 칸에 Ctrl + V 하세요.");
            }).catch(err => {
                alert("복사 실패: " + err);

  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('dashApp').style.display = 'none';
  document.getElementById('dashPw').value = '';
}

// 엔터키
document.getElementById('dashPw').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') dashLogin();
});

// 세션 복원
if (sessionStorage.getItem('dash_session')) {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashApp').style.display = 'block';
}
</script>
</body>
</html>
