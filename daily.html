<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>수거 일지 입력</title>
<style>
:root {
  --bg: #0a0a0f;
  --surface: #141418;
  --surface2: #1c1c22;
  --border: #2a2a35;
  --text: #f0f0f5;
  --text2: #a0a0b0;
  --text3: #55556a;
  --accent: #3D82F6;
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, 'Noto Sans KR', sans-serif; font-size: 14px; }

/* 로그인 화면 */
#loginScreen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
.login-box { width:100%; max-width:320px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:32px 24px; }
.login-title { font-size:18px; font-weight:700; color:var(--text); margin-bottom:6px; text-align:center; }
.login-sub { font-size:12px; color:var(--text3); text-align:center; margin-bottom:24px; }
.form-input { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:12px 14px; color:var(--text); font-size:15px; outline:none; }
.form-input:focus { border-color:var(--accent); }
.login-err { font-size:12px; color:#F87171; margin-top:6px; display:none; text-align:center; }
.btn-primary { width:100%; background:var(--accent); border:none; border-radius:8px; padding:13px; color:#fff; font-size:15px; font-weight:600; cursor:pointer; margin-top:16px; }

/* 앱 */
#app { display:none; flex-direction:column; height:100vh; }

/* 헤더 */
.header { background:var(--surface); border-bottom:1px solid var(--border); padding:10px 14px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.header-title { font-size:14px; font-weight:700; color:var(--text); }
.header-sub { font-size:11px; color:var(--text2); margin-top:2px; }
.header-right { display:flex; gap:8px; align-items:center; }
.btn-sm { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:6px 12px; color:var(--text2); font-size:12px; cursor:pointer; }
.btn-save { background:var(--accent); border:none; border-radius:8px; padding:6px 14px; color:#fff; font-size:12px; font-weight:600; cursor:pointer; }

/* 주차 선택 */
.week-bar { background:var(--surface); border-bottom:1px solid var(--border); padding:8px 14px; display:flex; gap:8px; align-items:center; flex-shrink:0; flex-wrap:wrap; }
.week-btn { background:var(--surface2); border:1px solid var(--border); border-radius:20px; padding:5px 12px; color:var(--text2); font-size:12px; cursor:pointer; }
.week-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
.date-label { font-size:12px; color:var(--text3); margin-left:auto; }

/* 테이블 영역 */
.table-wrap { flex:1; overflow:auto; -webkit-overflow-scrolling:touch; }
table { border-collapse: collapse; min-width: max-content; }

/* 헤더 행 */
thead th { position:sticky; top:0; background:var(--surface); z-index:10; padding:8px 4px; font-size:11px; color:var(--text2); border-bottom:1px solid var(--border); white-space:nowrap; text-align:center; }
thead th.col-client { position:sticky; top:0; left:0; z-index:20; background:var(--surface); padding:8px 10px; text-align:left; min-width:120px; }
thead th.group-header { border-bottom:none; padding-bottom:2px; color:#333345; font-size:10px; }

/* 거래처 열 고정 */
td.col-client { position:sticky; left:0; background:var(--surface2); z-index:5; padding:8px 10px; border-right:1px solid var(--border); min-width:120px; max-width:140px; text-align:left; vertical-align:top; }
td.col-client .client-name { font-size:13px; color:var(--text); font-weight:500; }
td.col-client .client-memo { font-size:10px; color:#FBBF24; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:110px; }
td.col-client .client-seq { font-size:10px; color:var(--text3); margin-right:4px; }

/* 입력 셀 */
td { border-bottom:1px solid var(--border); padding:4px 2px; text-align:center; vertical-align:middle; }
td input[type=number] { width:36px; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:5px 2px; font-size:13px; text-align:center; outline:none; -moz-appearance:textfield; }
td input.c-box { color:#60A5FA !important; }
td input.c-resin { color:#67E8F9 !important; }
td input.d-box { color:#F87171 !important; }
td input.d-resin { color:#FBBF24 !important; }
td input[type=number]::-webkit-inner-spin-button,
td input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; }
td input[type=number]:focus { border-color:var(--accent); background:var(--surface2); }
td input.c-box::placeholder { color:#1e3d6e; font-size:10px; }
td input.c-resin::placeholder { color:#134a57; font-size:10px; }
td input.d-box::placeholder { color:#6e2020; font-size:10px; }
td input.d-resin::placeholder { color:#6e4a10; font-size:10px; }
td input.c-box { color:#fff; }
td input.c-resin { color:#fff; }
td input.d-box { color:#fff; }
td input.d-resin { color:#fff; }

/* 구분선 */
.sep { border-left:2px solid var(--border); }

/* 행 추가 */
.add-row td { padding:8px; text-align:center; }
.btn-add-row { background:none; border:1px dashed var(--border); border-radius:8px; padding:6px 16px; color:var(--text3); font-size:12px; cursor:pointer; width:100%; }

/* 공지 모달 */
.modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:100; justify-content:center; align-items:center; }
.modal-overlay.show { display:flex; }
.modal { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px; width:90%; max-width:320px; position:relative; }
.modal h3 { font-size:15px; margin-bottom:12px; }
.modal-close { position:absolute; top:12px; right:12px; background:none; border:none; color:var(--text2); font-size:20px; cursor:pointer; }

/* 코스 설정 모달 */
.course-modal { max-width:360px; max-height:80vh; overflow-y:auto; }
.course-day-item { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--border); }
.course-day-label { font-size:12px; color:var(--text2); min-width:36px; }

/* 토스트 */
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1e1e2e; border:1px solid var(--border); border-radius:10px; padding:10px 20px; font-size:13px; color:var(--text); z-index:200; display:none; }
.toast.show { display:block; }
</style>
</head>
<body>

<!-- 로그인 -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-title">🚛 수거 일지</div>
    <div class="login-sub">엔비텍코리아 서울지점</div>
    <input id="loginId" class="form-input" type="text" placeholder="아이디" autocomplete="off" style="margin-bottom:8px">
    <input id="loginPw" class="form-input" type="password" placeholder="비밀번호" inputmode="numeric" maxlength="4">
    <div id="loginErr" class="login-err">아이디 또는 비밀번호가 올바르지 않습니다.</div>
    <button class="btn-primary" onclick="doLogin()">로그인</button>
  </div>
</div>

<!-- 앱 -->
<div id="app">
  <div class="header">
    <div>
      <div class="header-title">🚛 수거 일지 입력</div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:2px">
        <span class="header-sub" id="headerSub">박재영</span>
        <input type="date" id="selectedDate" style="background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:3px 6px;color:var(--text);font-size:11px;outline:none" onchange="onDateChange()">
      </div>
    </div>
    <div class="header-right">
      <button class="btn-sm" onclick="openCourseModal()">코스 설정</button>
      <button class="btn-sm" onclick="saveTempAll()" style="color:#34D399;border-color:#34D399">임시저장</button>
      <button class="btn-save" onclick="sendAll()">전체전송</button>
    </div>
  </div>

  <!-- 주차/요일 선택 -->
  <div class="week-bar" id="weekBar">
    <button class="week-btn" id="wk-A" onclick="selectWeek('A')">A주차</button>
    <button class="week-btn" id="wk-B" onclick="selectWeek('B')">B주차</button>
    <div style="width:1px;height:16px;background:var(--border)"></div>
    <button class="week-btn" id="dy-월" onclick="selectDay('월')">월</button>
    <button class="week-btn" id="dy-화" onclick="selectDay('화')">화</button>
    <button class="week-btn" id="dy-수" onclick="selectDay('수')">수</button>
    <button class="week-btn" id="dy-목" onclick="selectDay('목')">목</button>
    <button class="week-btn" id="dy-금" onclick="selectDay('금')">금</button>
    <span class="date-label" id="dateLabel"></span>
    <button id="loadBtn" class="btn-sm" onclick="loadData()" style="margin-left:auto;color:#60A5FA;border-color:#60A5FA">불러오기</button>
    <button id="confirmBtn" class="btn-sm" onclick="confirmData()" style="display:none;color:#34D399;border-color:#34D399">확정</button>
    <span id="confirmedLabel" style="display:none;font-size:11px;color:#34D399;margin-left:4px">✅ 확정됨</span>
  </div>

  <!-- 테이블 -->
  <div class="table-wrap">
    <table id="dailyTable">
      <thead>
        <tr>
          <th class="col-client" rowspan="2">거래처</th>
          <th colspan="10" class="group-header">수거</th>
          <th colspan="10" class="group-header sep">납품</th>
        </tr>
        <tr id="subHeader"></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<!-- 공지 모달 -->
<div class="modal-overlay" id="noticeModal">
  <div class="modal" style="text-align:center">
    <button class="modal-close" onclick="closeNotice()">✕</button>
    <div id="noticeText" style="font-size:16px;color:#fff;line-height:1.7;white-space:pre-wrap"></div>
  </div>
</div>

<!-- 코스 설정 모달 -->
<div class="modal-overlay" id="courseModal">
  <div class="modal course-modal">
    <button class="modal-close" onclick="closeCourseModal()">✕</button>
    <h3>📋 코스 설정</h3>
    <div style="margin-bottom:8px;font-size:12px;color:var(--text3)" id="courseWeekDayLabel">A주차 월요일</div>
    <div style="position:relative;margin-bottom:8px">
      <input id="courseSearch" class="form-input" type="text" placeholder="거래처 검색 (초성 가능)" autocomplete="off" oninput="courseAcFilter()">
      <div id="courseAcList" style="display:none;position:absolute;top:100%;left:0;right:0;background:#252535;border:1px solid #3a3a55;border-radius:8px;z-index:50;max-height:180px;overflow-y:auto;margin-top:4px"></div>
    </div>
    <div id="courseClientList" style="margin-bottom:12px;max-height:300px;overflow-y:auto"></div>
    <button class="btn-save" style="width:100%;padding:10px" onclick="saveCourse()">저장</button>
  </div>
</div>

<!-- 거래처 추가 모달 -->
<div class="modal-overlay" id="addRowModal">
  <div class="modal" style="max-width:320px">
    <button class="modal-close" onclick="closeAddRowModal()">✕</button>
    <h3 style="margin-bottom:12px">거래처 추가</h3>
    <div style="position:relative">
      <input id="addRowSearch" class="form-input" type="text" placeholder="거래처 검색 (초성 가능)" autocomplete="off" oninput="addRowAcFilter()">
      <div id="addRowAcList" style="display:none;position:absolute;top:100%;left:0;right:0;background:#252535;border:1px solid #3a3a55;border-radius:8px;z-index:50;max-height:200px;overflow-y:auto;margin-top:4px"></div>
    </div>
  </div>
</div>

<!-- 메모 팝업 -->
<div class="modal-overlay" id="memoModal">
  <div class="modal" style="max-width:320px">
    <button class="modal-close" onclick="document.getElementById('memoModal').classList.remove('show')">✕</button>
    <h3 id="memoModalTitle" style="margin-bottom:6px;font-size:14px"></h3>
    <div id="memoPrevText" style="font-size:11px;color:#FBBF24;margin-bottom:12px"></div>
    <textarea id="memoInput" class="form-input" rows="3" style="resize:none;font-size:14px" placeholder="오늘 메모 입력..."></textarea>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button onclick="deleteMemo()" style="padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:#F87171;font-size:13px;cursor:pointer">삭제</button>
      <button onclick="saveMemo()" style="flex:1;padding:10px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:13px;font-weight:600;cursor:pointer">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 로그아웃 확인 -->
<div class="modal-overlay" id="exitModal">
  <div class="modal" style="max-width:280px;text-align:center">
    <div style="font-size:24px;margin-bottom:12px">👋</div>
    <div style="font-size:15px;color:var(--text);margin-bottom:20px">로그아웃 하시겠어요?</div>
    <div style="display:flex;gap:10px">
      <button onclick="document.getElementById('exitModal').classList.remove('show');window._exitOpen=false;" style="flex:1;padding:11px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:14px;cursor:pointer">아니요</button>
      <button onclick="doLogout()" style="flex:1;padding:11px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer">네</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, doc, getDocs, query, where, getDoc, setDoc, Timestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCka6GbEUJBUf-5BFxvD0O-Hv9dS-T3Big",
  authDomain: "jypenvitec.firebaseapp.com",
  projectId: "jypenvitec",
  storageBucket: "jypenvitec.appspot.com",
  messagingSenderId: "760975820830",
  appId: "1:760975820830:web:8b20d40a3d1cf3a1f8e9de"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 상수
const COLS = ['4','12','30','50','63','1','2','5','10','20'];
const SIZES = ['4L','12L','30L','50L','63L','1L','2L','5L','10L','20L'];
const DAYS = ['월','화','수','목','금'];

let currentUser = null;
let currentWeek = 'A';
let currentDay = '';
let courseClients = []; // 오늘 코스 거래처 목록
let memoCache = {}; // 거래처별 최근 메모

// ── 유틸 ──
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getKorDay() {
  const days = ['일','월','화','수','목','금','토'];
  return days[new Date().getDay()];
}
function toast(msg, type='success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderColor = type === 'success' ? '#34D399' : '#F87171';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// ── 로그인 ──
window.doLogin = async function() {
  const id = document.getElementById('loginId').value.trim();
  const pw = document.getElementById('loginPw').value.trim();
  document.getElementById('loginErr').style.display = 'none';
  try {
    // 관리자 체크
    const adminDoc = await getDoc(doc(db, 'adminConfig', 'auth'));
    if (id === 'admin' && adminDoc.exists() && adminDoc.data().password === pw) {
      currentUser = { type: 'admin', name: '관리자', userId: 'admin' };
      localStorage.setItem('daily_session', JSON.stringify(currentUser));
      startApp();
      for (let i = 0; i < 5; i++) history.pushState(null, '', location.href);
      return;
    }
    // 일반 사용자
    const snap = await getDocs(query(collection(db,'users'), where('userId','==',id)));
    for (const ud of snap.docs) {
      if (ud.data().password === pw) {
        currentUser = { type:'vehicle', userId:id, name:ud.data().name||'', docId:ud.id, cars:ud.data().cars||[] };
        localStorage.setItem('daily_session', JSON.stringify(currentUser));
        startApp();
        for (let i = 0; i < 5; i++) history.pushState(null, '', location.href);
        return;
      }
    }
  } catch(e) {}
  document.getElementById('loginErr').style.display = 'block';
};

document.getElementById('loginId').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('loginPw').focus(); });
document.getElementById('loginPw').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

// ── 앱 시작 ──
async function startApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';

  const todayStr = today();
  const korDay = getKorDay();
  document.getElementById('headerSub').textContent = (currentUser.name || currentUser.userId);
  document.getElementById('selectedDate').value = todayStr;
  document.getElementById('dateLabel').textContent = todayStr;

  // 서브헤더 렌더
  renderSubHeader();

  // 오늘 요일 자동 선택
  if (DAYS.includes(korDay)) {
    currentDay = korDay;
    document.getElementById('dy-' + korDay).classList.add('active');
  } else {
    currentDay = '월';
    document.getElementById('dy-월').classList.add('active');
  }

  // 저장된 주차 불러오기
  const savedWeek = localStorage.getItem('daily_week_' + currentUser.userId) || 'A';
  selectWeek(savedWeek, false);

  // 거래처 목록 미리 로드
  try {
    const snap = await getDocs(collection(db, 'clients'));
    allClients = snap.docs.map(d=>d.data().name).filter(Boolean).sort();
  } catch(e) { allClients = []; }

  // 코스 불러오기
  loadCourse();
}

// ── 서브헤더 ──
function renderSubHeader() {
  const tr = document.getElementById('subHeader');
  const cColors = ['#1e3d6e','#1e3d6e','#1e3d6e','#1e3d6e','#1e3d6e','#134a57','#134a57','#134a57','#134a57','#134a57'];
  const dColors = ['#6e2020','#6e2020','#6e2020','#6e2020','#6e2020','#6e4a10','#6e4a10','#6e4a10','#6e4a10','#6e4a10'];
  let html = '';
  COLS.forEach((c, i) => {
    html += '<td style="padding:4px 2px;font-size:10px;color:' + cColors[i] + ';text-align:center;border-bottom:1px solid var(--border);white-space:nowrap' + (i===5?' border-left:2px solid var(--border)':'') + '">' + c + '</td>';
  });
  html += '<td style="border-left:2px solid var(--border);padding:4px 2px;font-size:10px;color:var(--text3);text-align:center;border-bottom:1px solid var(--border)"></td>';
  COLS.forEach((c, i) => {
    html += '<td style="padding:4px 2px;font-size:10px;color:' + dColors[i] + ';text-align:center;border-bottom:1px solid var(--border);white-space:nowrap">' + c + '</td>';
  });
  tr.innerHTML = html;
}">${c}</td>`;
  });
  html += `<td style="border-left:2px solid var(--border);padding:4px 2px;font-size:10px;color:var(--text3);text-align:center;border-bottom:1px solid var(--border)"></td>`;
  COLS.forEach((c, i) => {
    html += `<td style="padding:4px 2px;font-size:10px;color:var(--text3);text-align:center;border-bottom:1px solid var(--border);white-space:nowrap">${c}</td>`;
  });
  tr.innerHTML = html;
}

// ── 주차 선택 ──
window.selectWeek = function(week, reload=true) {
  currentWeek = week;
  localStorage.setItem('daily_week_' + currentUser.userId, week);
  document.querySelectorAll('[id^="wk-"]').forEach(el => el.classList.remove('active'));
  document.getElementById('wk-' + week).classList.add('active');
  if (reload) loadCourse();
};

// ── 요일 선택 ──
window.selectDay = function(day) {
  currentDay = day;
  document.querySelectorAll('[id^="dy-"]').forEach(el => el.classList.remove('active'));
  document.getElementById('dy-' + day).classList.add('active');
  loadCourse();
};

// ── 코스 불러오기 ──
async function loadCourse() {
  const key = currentUser.userId + '_' + currentWeek + '_' + currentDay;
  try {
    const snap = await getDoc(doc(db, 'courses', key));
    courseClients = snap.exists() ? (snap.data().clients || []) : [];
  } catch(e) {
    courseClients = [];
  }
  await loadMemos();
  renderTable();
}

// ── 최근 메모 불러오기 ──
async function loadMemos() {
  if (!courseClients.length) return;
  memoCache = {};
  for (const name of courseClients) {
    try {
      const snap = await getDocs(query(collection(db,'일지db'), where('clientName','==',name)));
      if (!snap.empty) {
        const docs = snap.docs.map(d=>d.data()).filter(d=>d.memo);
        if (docs.length) {
          docs.sort((a,b)=>(b.timestamp?.seconds||0)-(a.timestamp?.seconds||0));
          memoCache[name] = docs[0].memo;
        }
      }
    } catch(e) {}
  }
}

async function saveTempStorage() {
  if (!currentUser) return;
  const date = document.getElementById('selectedDate')?.value || today();

  try {
    await setDoc(doc(db, 'dailyTemp', key), {

      date,
      userId: currentUser.userId,
      updatedAt: Timestamp.now()
    });

}

async function loadTempStorage(date) {
  if (!currentUser) return false;
  const key = currentUser.userId + '_' + date;
  try {
    const snap = await getDoc(doc(db, 'dailyTemp', key));
    if (snap.exists()) {
      const data = snap.data();
      if (data.clients) courseClients = data.clients;
      inputCache = data.cache || {};

  return false;
}

window.onDateChange = function() {
  const date = document.getElementById('selectedDate').value;

    const el = document.getElementById(id);

// ── 불러오기 ──
window.loadData = async function() {
  const date = document.getElementById('selectedDate').value || today();
  const todayStr = today();
  inputCache = {};
  courseClients = [];

  if (date === todayStr) {
    // 오늘: 코스 + 임시저장 불러오기
    await loadCourse();
    const hasTmp = await loadTempStorage(date);
    if (hasTmp) toast('임시저장 데이터 불러왔어요!', 'success');
  } else {
    // 이전날짜: DB에서 seq 있는 데이터 불러오기
    try {
      const carNumber = currentUser.cars?.[0] || '';
      const q = carNumber
        ? query(collection(db,'일지db'), where('date','==',date), where('carNumber','==',carNumber), where('seq','>=',1))
        : query(collection(db,'일지db'), where('date','==',date), where('seq','>=',1));
      const snap = await getDocs(q);
      if (!snap.empty) {
        const docs = snap.docs.map(d=>({...d.data(), id:d.id}));
        docs.sort((a,b)=>(a.seq||0)-(b.seq||0));
        courseClients = docs.map(d=>d.clientName);
        docs.forEach((d, idx) => {
          inputCache[idx] = { collect:{}, deliver:{}, memo: d.memo||'' };
          SIZES.forEach(sz => {
            inputCache[idx].collect[sz] = d['collect'+sz] ? String(d['collect'+sz]) : '';
            inputCache[idx].deliver[sz] = d['deliver'+sz] ? String(d['deliver'+sz]) : '';
          });
        });
        await loadMemos();
        renderTable();
        toast(`${docs.length}건 불러왔어요!`, 'success');
      } else {
        toast('해당 날짜 데이터가 없어요', 'error');
      }
    } catch(e) { toast('불러오기 실패: ' + e.message, 'error'); }
  }

  document.getElementById('confirmBtn').style.display = '';
  document.getElementById('loadBtn').style.display = 'none';
};

function saveInputCache() {
  courseClients.forEach((name, idx) => {
    const row = document.querySelector(`tr[data-idx="${idx}"]`);
    if (!row) return;
    if (!inputCache[idx]) inputCache[idx] = { collect:{}, deliver:{}, memo: inputCache[idx]?.memo || '' };
    SIZES.forEach(sz => {
      const c = row.querySelector(`[data-type="collect"][data-key="${sz}"]`);
      const d = row.querySelector(`[data-type="deliver"][data-key="${sz}"]`);
      if (c) inputCache[idx].collect[sz] = c.value;
      if (d) inputCache[idx].deliver[sz] = d.value;
    });
  });
}

function renderTable() {
  saveInputCache();
  const tbody = document.getElementById('tableBody');
  let html = '';

  courseClients.forEach((name, idx) => {
    const cache = inputCache[idx] || { collect:{}, deliver:{}, memo:'' };
    const todayMemo = cache.memo || '';
    const prevMemo = memoCache[name] || '';

    html += `<tr data-idx="${idx}">`;
    html += `<td class="col-client" onclick="openMemoModal(${idx})" style="cursor:pointer">
      <span class="client-seq">${idx+1}.</span>
      <span class="client-name">${name}</span>
      ${prevMemo ? `<div class="client-memo">${prevMemo}</div>` : ''}
      ${todayMemo ? `<div style="font-size:10px;color:#34D399;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px">📝 ${todayMemo}</div>` : ''}
    </td>`;
    // 수거 박스(0~4) 파란색, 합성(5~9) 하늘색
    SIZES.forEach((sz, i) => {
      const v = cache.collect[sz] || '';
      const cls = i < 5 ? 'c-box' : 'c-resin';
      html += `<td${i===5?' class="sep"':''}>
        <input type="number" placeholder="${COLS[i]}" data-row="${idx}" data-type="collect" data-key="${sz}" min="0" value="${v}" class="${cls}">
      </td>`;
    });
    // 납품 박스(0~4) 빨간색, 합성(5~9) 주황색
    html += `<td class="sep"></td>`;
    SIZES.forEach((sz, i) => {
      const v = cache.deliver[sz] || '';
      const cls = i < 5 ? 'd-box' : 'd-resin';
      html += `<td>
        <input type="number" placeholder="${COLS[i]}" data-row="${idx}" data-type="deliver" data-key="${sz}" min="0" value="${v}" class="${cls}">
      </td>`;
    });
    html += '</tr>';
  });

  // 추가 버튼 없음 (코스 설정에서만 추가)
  tbody.innerHTML = html;
}

// ── 전체 전송 (DB 저장) ──
window.sendAll = async function() {
  if (!confirm('전체 전송하시겠습니까?\n전송 후 임시저장 데이터가 삭제됩니다.')) return;
  saveInputCache();
  const todayStr = document.getElementById('selectedDate').value || today();
  const carNumber = currentUser.cars?.[0] || '';
  let count = 0;
  const baseTime = Date.now();

  for (let idx = 0; idx < courseClients.length; idx++) {
    const name = courseClients[idx];
    const row = document.querySelector(`tr[data-idx="${idx}"]`);
    if (!row) continue;

    const ts = Timestamp.fromMillis(baseTime + idx * 1000);
    const cache = inputCache[idx] || { collect:{}, deliver:{}, memo:'' };
    const data = { clientName: name, date: todayStr, carNumber, seq: idx + 1, timestamp: ts, memo: cache.memo || '' };
    let hasData = false;

    // 수거
    if (!inputCache[idx]) inputCache[idx] = { collect:{}, deliver:{}, memo:'' };
    SIZES.forEach(sz => {
      const el = row.querySelector(`[data-type="collect"][data-key="${sz}"]`);
      const v = parseInt(el?.value) || 0;
      if (v > 0) hasData = true;
      inputCache[idx].collect[sz] = v ? String(v) : '';
      data['collect' + sz] = v;
    });

    // 납품
    SIZES.forEach(sz => {
      const el = row.querySelector(`[data-type="deliver"][data-key="${sz}"]`);
      const v = parseInt(el?.value) || 0;
      if (v > 0) hasData = true;
      inputCache[idx].deliver[sz] = v ? String(v) : '';
      data['deliver' + sz] = v;
    });

    if (cache.memo) hasData = true;

    if (!hasData) continue;

    try {
      await addDoc(collection(db,'일지db'), data);
      count++;
    } catch(e) { console.error(e); }
  }

  if (count > 0) {
    clearTempStorage();
    toast(`${count}건 전송 완료!`, 'success');
  } else toast('입력된 데이터가 없어요', 'error');
};

const CHOSUNG = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
function getChosung(str) {
  return [...str].map(ch => {
    const c = ch.charCodeAt(0);
    if (c >= 0xAC00 && c <= 0xD7A3) return CHOSUNG[Math.floor((c-0xAC00)/(21*28))];
    return ch;
  }).join('');
}

let allClients = [];
let tempCourseClients = [];

window.openCourseModal = async function() {

function renderCourseClientList() {
  const el = document.getElementById('courseClientList');
  if (!tempCourseClients.length) {
    el.innerHTML = '<div style="font-size:12px;color:var(--text3);padding:8px 0">거래처를 검색해서 추가하세요</div>';
    return;
  }
  el.innerHTML = tempCourseClients.map((name, i) => `
    <div class="course-drag-item" data-idx="${i}" style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);cursor:grab;touch-action:none">
      <span style="font-size:16px;color:var(--text3);cursor:grab;padding:0 4px">☰</span>
      <span style="font-size:11px;color:var(--text3);min-width:20px">${i+1}.</span>
      <span style="flex:1;font-size:13px;color:var(--text)">${name}</span>
      <button onclick="removeCourseClient(${i})" style="background:none;border:none;color:#F87171;font-size:16px;cursor:pointer;padding:0 4px">✕</button>
    </div>
  `).join('');
  initCourseDrag();
}

function initCourseDrag() {
  const items = document.querySelectorAll('.course-drag-item');
  let dragIdx = null, dragEl = null, startY = 0, origTop = 0;

  items.forEach(item => {
    item.addEventListener('touchstart', e => {
      dragIdx = parseInt(item.dataset.idx);
      dragEl = item;
      startY = e.touches[0].clientY;
      origTop = item.getBoundingClientRect().top;
      item.style.opacity = '0.5';
      item.style.background = 'var(--surface)';
    }, { passive: true });

    item.addEventListener('touchmove', e => {
      if (dragIdx === null) return;
      e.preventDefault();
      const y = e.touches[0].clientY;
      const diff = y - startY;
      const allItems = [...document.querySelectorAll('.course-drag-item')];
      allItems.forEach((el, i) => {
        if (i === dragIdx) return;
        const rect = el.getBoundingClientRect();
        const mid = rect.top + rect.height / 2;
        if (diff > 0 && y > mid && i > dragIdx) {
          el.style.transform = 'translateY(-40px)';
        } else if (diff < 0 && y < mid && i < dragIdx) {
          el.style.transform = 'translateY(40px)';
        } else {
          el.style.transform = '';
        }
      });
    }, { passive: false });

    item.addEventListener('touchend', e => {
      if (dragIdx === null) return;
      const y = e.changedTouches[0].clientY;
      const allItems = [...document.querySelectorAll('.course-drag-item')];
      let targetIdx = dragIdx;
      allItems.forEach((el, i) => {
        if (i === dragIdx) return;
        const rect = el.getBoundingClientRect();
        const mid = rect.top + rect.height / 2;
        if (Math.abs(y - mid) < 30) targetIdx = i;
      });
      if (targetIdx !== dragIdx) {
        const item = tempCourseClients.splice(dragIdx, 1)[0];
        tempCourseClients.splice(targetIdx, 0, item);
      }
      dragIdx = null; dragEl = null;
      renderCourseClientList();
    });
  });
}
