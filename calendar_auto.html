<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>연간달력인쇄용</title>
    <style>
        @page {
            size: A4 portrait;
            margin: 0;
        }
        body {
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #555;
            color: #333;
        }
        .controls-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #222;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .controls-bar input {
            font-size: 16px;
            padding: 5px 10px;
            width: 80px;
            text-align: center;
        }
        .controls-bar button {
            font-size: 16px;
            padding: 5px 15px;
            background: #4F81BD;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .controls-bar button:hover {
            background: #385D8A;
        }
        .container {
            padding-top: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* 페이지 공통 스타일 (A4 세로) */
        .page {
            width: 210mm;
            height: 297mm;
            padding: 12mm 12mm;
            box-sizing: border-box;
            background: white;
            margin-bottom: 20px;
            page-break-after: always;
            break-after: page;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        /* 연간 표지 스타일 */
        .cover-header {
            text-align: center;
            border-bottom: 3px solid #4F81BD;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .cover-title {
            font-size: 34px;
            font-weight: bold;
            color: #1F497D;
        }
        .annual-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 8px;
            flex-grow: 1;
        }
        .mini-month {
            border: 1px solid #D3D3D3;
            padding: 5px;
            display: flex;
            flex-direction: column;
            background: #FAFAFA;
            box-sizing: border-box;
        }
        .mini-title {
            font-size: 14px;
            font-weight: bold;
            color: #1F497D;
            text-align: center;
            margin-bottom: 3px;
            border-bottom: 1px solid #B0C4DE;
            padding-bottom: 2px;
        }
        .mini-table {
            width: 100%;
            border-collapse: collapse;
            flex-grow: 1;
        }
        .mini-table th {
            font-size: 10px;
            color: #555;
            padding: 2px 0;
            background: #EAEAEA;
        }
        .mini-table th:first-child { color: #C00000; }
        .mini-table th:last-child { color: #0070C0; }
        .mini-table td {
            font-size: 10px;
            text-align: center;
            padding: 2px 0;
            vertical-align: middle;
        }
        .mini-sun { color: #C00000; font-weight: bold; }
        .mini-sat { color: #0070C0; font-weight: bold; }
        .mini-other { color: #CCC; font-weight: normal; }

        /* 월별 상세 페이지 스타일 */
        .header-banner {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 3px solid #4F81BD;
            padding-bottom: 5px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }
        .month-title {
            font-size: 28px;
            font-weight: bold;
            color: #1F497D;
        }
        .calendar-table {
            width: 100%;
            border-collapse: collapse;
            flex-grow: 1;
            table-layout: fixed;
        }
        .calendar-table th {
            background-color: #F2F4F7;
            color: #333333;
            font-size: 13px;
            font-weight: bold;
            padding: 6px 0;
            border: 1px solid #B0C4DE;
            width: 14.28%;
        }
        .calendar-table th:first-child {
            background-color: #FFECEC;
            color: #C00000;
        }
        .calendar-table th:last-child {
            background-color: #E8F0FE;
            color: #0070C0;
        }
        .calendar-table td {
            border: 1px solid #D3D3D3;
            vertical-align: top;
            padding: 4px 5px;
            height: calc((297mm - 24mm - 45mm - 30mm) / 6);
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }
        .date-number {
            font-size: 18px;
            margin-bottom: 2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            padding: 2px;
            border-radius: 3px;
        }
        .date-number:hover {
            background-color: #F0F4F8;
        }
        .sun { color: #C00000; font-weight: bold; }
        .sat { color: #0070C0; font-weight: bold; }
        .normal { color: #222222; font-weight: bold; }
        .other-month { color: #CCCCCC; font-weight: normal; }
        
        .holiday-name {
            font-size: 10px;
            color: #C00000;
            font-weight: bold;
            background: #FFF0F0;
            padding: 1px 4px;
            border-radius: 3px;
            border: 1px solid #FFD0D0;
        }
        .holiday-name:empty {
            display: none;
        }

        .memo-area {
            font-size: 11px;
            color: #333;
            margin-top: 2px;
            height: calc(100% - 24px);
            outline: none;
            white-space: pre-wrap;
            word-break: break-all;
            background-color: #FCFCFC;
            border: 1px dashed #D0D0D0;
            border-radius: 3px;
            padding: 3px;
            box-sizing: border-box;
        }
        .memo-area:focus {
            background-color: #FFFFFF;
            border-color: #4F81BD;
        }

        /* 커스텀 팝업(모달) 스타일 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-box {
            background: white;
            padding: 20px 25px;
            border-radius: 8px;
            width: 320px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }
        .modal-title {
            font-size: 16px;
            font-weight: bold;
            color: #1F497D;
            margin-bottom: 12px;
        }
        .modal-input {
            width: 100%;
            padding: 8px 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .modal-btn {
            padding: 6px 14px;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .modal-btn.cancel {
            background: #E0E0E0;
            color: #333;
        }
        .modal-btn.save {
            background: #4F81BD;
            color: white;
        }
        .modal-btn.save:hover {
            background: #385D8A;
        }

        @media print {
            /* 인쇄 시 요일 셀 및 공휴일 배경색 유지 설정 */
            body, .calendar-table th, .holiday-name {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            body {
                background: none;
            }
            .controls-bar {
                display: none !important;
            }
            .modal-overlay {
                display: none !important;
            }
            .container {
                padding-top: 0 !important;
            }
            .page {
                margin: 0;
                box-shadow: none;
                page-break-after: always;
                break-after: page;
                width: 210mm;
                height: 297mm;
                padding: 12mm 12mm;
            }
            .memo-area[contenteditable="true"] {
                border: none !important;
                background: transparent !important;
            }
            .holiday-name {
                border: none !important;
            }
            .date-number {
                background: transparent !important;
                cursor: default !important;
            }
        }
    </style>
</head>
<body>

<div class="controls-bar">
    <label for="yearInput"><b>기준 연도:</b></label>
    <input type="number" id="yearInput" value="2026" min="2000" max="2100" onchange="generateCalendar()">
    <button onclick="window.print()">프린트 / PDF 저장</button>
</div>

<div class="container" id="calendarContainer"></div>

<!-- 커스텀 팝업 모달창 -->
<div class="modal-overlay" id="holidayModal" onclick="if(event.target === this) closeHolidayModal()">
    <div class="modal-box">
        <div class="modal-title" id="modalTitleText">공휴일/기념일 설정</div>
        <input type="text" id="modalInput" class="modal-input" placeholder="이름을 입력하세요 (비우면 삭제)" onkeydown="if(event.key==='Enter') saveModalHoliday()">
        <div class="modal-buttons">
            <button class="modal-btn cancel" onclick="closeHolidayModal()">취소</button>
            <button class="modal-btn save" onclick="saveModalHoliday()">저장</button>
        </div>
    </div>
</div>

<script>
let userEdits = {};
let currentEditingKey = "";

document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
        closeHolidayModal();
    }
});

function getBaseHolidays(year) {
    let holidays = {
        [`${year}-01-01`]: "신정",
        [`${year}-03-01`]: "삼일절",
        [`${year}-05-05`]: "어린이날",
        [`${year}-06-06`]: "현충일",
        [`${year}-08-15`]: "광복절",
        [`${year}-10-03`]: "개천절",
        [`${year}-10-09`]: "한글날",
        [`${year}-12-25`]: "크리스마스"
    };
    
    if (year === 2026) {
        holidays["2026-02-16"] = "설날 연휴";
        holidays["2026-02-17"] = "설날";
        holidays["2026-02-18"] = "설날 연휴";
        holidays["2026-05-24"] = "부처님오신날";
        holidays["2026-05-25"] = "대체공휴일";
        holidays["2026-09-24"] = "추석 연휴";
        holidays["2026-09-25"] = "추석";
        holidays["2026-09-26"] = "추석 연휴";
        holidays["2026-03-02"] = "대체공휴일";
    } else if (year === 2027) {
        holidays["2027-02-06"] = "설날 연휴";
        holidays["2027-02-07"] = "설날";
        holidays["2027-02-08"] = "설날 연휴";
        holidays["2027-05-13"] = "부처님오신날";
        holidays["2027-08-16"] = "대체공휴일";
        holidays["2027-09-14"] = "추석 연휴";
        holidays["2027-09-15"] = "추석";
        holidays["2027-09-16"] = "추석 연휴";
        holidays["2027-10-04"] = "대체공휴일";
    }

    const solarTargets = ["03-01", "05-05", "08-15", "10-03", "10-09"];
    solarTargets.forEach(md => {
        const d = new Date(`${year}-${md}`);
        if (d.getDay() === 0) {
            const nextDay = new Date(d);
            nextDay.setDate(d.getDate() + 1);
            const mStr = String(nextDay.getMonth() + 1).padStart(2, '0');
            const dStr = String(nextDay.getDate()).padStart(2, '0');
            const altKey = `${year}-${mStr}-${dStr}`;
            if (!holidays[altKey]) {
                holidays[altKey] = "대체공휴일";
            }
        }
    });

    return holidays;
}

function getHolidays(year) {
    let holidays = getBaseHolidays(year);
    
    for (let dateKey in userEdits) {
        if (dateKey.startsWith(year)) {
            if (userEdits[dateKey] === "") {
                delete holidays[dateKey];
            } else {
                holidays[dateKey] = userEdits[dateKey];
            }
        }
    }
    return holidays;
}

function openHolidayModal(year, month, day, currentText) {
    const mStr = String(month).padStart(2, '0');
    const dStr = String(day).padStart(2, '0');
    currentEditingKey = `${year}-${mStr}-${dStr}`;
    
    document.getElementById("modalTitleText").innerText = `${year}년 ${month}월 ${day}일 공휴일/기념일 설정`;
    document.getElementById("modalInput").value = currentText;
    
    const modal = document.getElementById("holidayModal");
    modal.style.display = "flex";
    document.getElementById("modalInput").focus();
}

function closeHolidayModal() {
    document.getElementById("holidayModal").style.display = "none";
}

function saveModalHoliday() {
    const val = document.getElementById("modalInput").value.trim();
    userEdits[currentEditingKey] = val;
    closeHolidayModal();
    generateCalendar();
}

function generateCalendar() {
    const year = parseInt(document.getElementById("yearInput").value);
    const container = document.getElementById("calendarContainer");
    container.innerHTML = "";
    
    const holidays = getHolidays(year);
    const weekdays = ["일요일", "월요일", "화요일", "수요일", "목요일", "금요일", "토요일"];
    const miniWeekdays = ["일", "월", "화", "수", "목", "금", "토"];

    // 1. 첫 번째 페이지: 연간 표지 생성
    const coverPage = document.createElement("div");
    coverPage.className = "page";
    
    let coverHeader = `<div class="cover-header"><div class="cover-title">${year}년 연간 캘린더</div></div>`;
    let annualGrid = `<div class="annual-grid">`;
    
    for (let m = 1; m <= 12; m++) {
        annualGrid += `<div class="mini-month">`;
        annualGrid += `<div class="mini-title">${m}월</div>`;
        annualGrid += `<table class="mini-table"><thead><tr>`;
        miniWeekdays.forEach(dw => { annualGrid += `<th>${dw}</th>`; });
        annualGrid += `</tr></thead><tbody>`;
        
        const firstDay = new Date(year, m - 1, 1);
        const lastDay = new Date(year, m, 0);
        const startDayOfWeek = firstDay.getDay();
        const totalDays = lastDay.getDate();
        const prevLastDay = new Date(year, m - 1, 0).getDate();
        
        let currDate = 1;
        let nextDate = 1;
        
        for (let r = 0; r < 6; r++) {
            let rowHtml = "<tr>";
            for (let c = 0; c < 7; c++) {
                let dNum = 0;
                let cls = "";
                if (r === 0 && c < startDayOfWeek) {
                    dNum = prevLastDay - startDayOfWeek + c + 1;
                    cls = "mini-other";
                } else if (currDate > totalDays) {
                    dNum = nextDate++;
                    cls = "mini-other";
                } else {
                    dNum = currDate++;
                    if (c === 0) cls = "mini-sun";
                    else if (c === 6) cls = "mini-sat";
                }
                rowHtml += `<td class="${cls}">${dNum}</td>`;
            }
            rowHtml += "</tr>";
            annualGrid += rowHtml;
            if (currDate > totalDays && r >= 4) break;
        }
        annualGrid += `</tbody></table></div>`;
    }
    annualGrid += `</div>`;
    
    coverPage.innerHTML = coverHeader + annualGrid;
    container.appendChild(coverPage);

    // 2. 2페이지부터 13페이지까지: 월별 상세 6주 고정 달력 생성
    for (let month = 1; month <= 12; month++) {
        const pageDiv = document.createElement("div");
        pageDiv.className = "page";
        
        const headerDiv = document.createElement("div");
        headerDiv.className = "header-banner";
        headerDiv.innerHTML = `<div class="month-title">${month}월 ${year}</div>`;
        pageDiv.appendChild(headerDiv);
        
        const table = document.createElement("table");
        table.className = "calendar-table";
        
        let thead = "<thead><tr>";
        weekdays.forEach((day) => {
            thead += `<th>${day}</th>`;
        });
        thead += "</tr></thead>";
        
        let tbody = "<tbody>";
        
        const firstDay = new Date(year, month - 1, 1);
        const lastDay = new Date(year, month, 0);
        
        const startDayOfWeek = firstDay.getDay();
        const totalDays = lastDay.getDate();
        const prevLastDay = new Date(year, month - 1, 0).getDate();
        
        let currentDate = 1;
        let nextMonthDate = 1;
        
        for (let i = 0; i < 6; i++) {
            tbody += "<tr>";
            for (let j = 0; j < 7; j++) {
                let cellClass = "normal";
                let isOther = false;
                
                let cellYear = year;
                let cellMonth = month;
                let cellDayNum = 0;
                
                if (i === 0 && j < startDayOfWeek) {
                    cellDayNum = prevLastDay - startDayOfWeek + j + 1;
                    cellClass = "other-month";
                    isOther = true;
                    cellMonth = month - 1;
                    if (cellMonth === 0) { cellMonth = 12; cellYear--; }
                } else if (currentDate > totalDays) {
                    cellDayNum = nextMonthDate++;
                    cellClass = "other-month";
                    isOther = true;
                    cellMonth = month + 1;
                    if (cellMonth === 13) { cellMonth = 1; cellYear++; }
                } else {
                    cellDayNum = currentDate++;
                    if (j === 0) cellClass = "sun";
                    else if (j === 6) cellClass = "sat";
                    else cellClass = "normal";
                }
                
                const mStr = String(cellMonth).padStart(2, '0');
                const dStr = String(cellDayNum).padStart(2, '0');
                const dateKey = `${cellYear}-${mStr}-${dStr}`;
                
                let holidayText = "";
                if (!isOther && holidays[dateKey]) {
                    holidayText = holidays[dateKey];
                    cellClass = "sun";
                }
                
                let clickAttr = isOther ? "" : `onclick="openHolidayModal(${cellYear}, ${cellMonth}, ${cellDayNum}, '${holidayText}')"`;
                let hoverClass = isOther ? "" : "date-number";

                tbody += `<td>
                    <div class="${hoverClass}" ${clickAttr}>
                        <span class="${cellClass}">${cellDayNum}</span>
                        <span class="holiday-name">${holidayText}</span>
                    </div>
                    <div class="memo-area" contenteditable="true"></div>
                </td>`;
            }
            tbody += "</tr>";
        }
        
        tbody += "</tbody>";
        table.innerHTML = thead + tbody;
        pageDiv.appendChild(table);
        container.appendChild(pageDiv);
    }
}

window.onload = generateCalendar;
</script>

</body>
</html>
